      /GF 启用只读字符串池                    /Gy[-] 分隔链接器函数
      /GS[-] 启用安全检查                     /GR[-] 启用 C++ RTTI
      /guard:cf[-] 启用 CFG (控制流保护)      /guard:ehcont[-] 启用 EH 继续元数据(CET)
